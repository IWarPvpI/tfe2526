version: "3.9"

services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.frontend
    container_name: frontend_dev
    ports:
      - "5173:5173"
    env_file:
        - .env
    volumes:
      - ./front:/app    
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host

  backend:
      build:
        context: ./back
        dockerfile: Dockerfile.backend
      container_name: backend_dev
      ports:
        - "3000:3000"
      env_file:
        - .env
      volumes:
        - ./back:/app
      environment:
        - NODE_ENV=development
        - DB_HOST=db        # garde juste ça, le host doit pointer vers le service "db"
      depends_on:
        - db
      command: npm run start:dev

  db:
    image: postgres:15-alpine
    container_name: uniship_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
